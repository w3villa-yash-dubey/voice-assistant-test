# Local LiveKit server config (used by docker-compose / livekit-server --config)
port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false

# Dev keys — match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env
keys:
  devkey: secret

logging:
  level: info
